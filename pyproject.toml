[project]
name = "memorelay-core"
version = "2.0.0"
description = "MemoRelay-Core (Core local memory engine) — MemoRelay subsystem"
requires-python = ">=3.11"
# The KW 2.0 core is standard-library only on purpose. The baseline clean
# install failed because the v1 MCP dependency chain pulls cryptography, which
# has no macOS 13 / Intel wheel and cannot be built here (baseline evidence:
# docs/baseline-20261030/evidence/dependency-install.log). Core installability
# is a release gate (AC-41): keep `dependencies` empty and put every optional
# capability in its own extra below.
dependencies = []

[project.optional-dependencies]
# Legacy KW 1.x MCP server dependency chain (README "As an MCP server"). It is
# NOT part of the 2.0 core install and does not install as a wheel set on this
# target; see requirements/README.md.
v1 = [
    "mcp>=1.0.0,<2",
    # cryptography 50.x ships no macOS x86_64 wheel and cannot be built on this
    # Intel iMac; 48.0.1 has a universal2 wheel. The upper bound keeps the
    # optional legacy environment installable without a compiler (AC-41).
    "cryptography>=3.4,<50",
    "httpx>=0.27.0",
    "sqlite-vec>=0.1.0",
    "pypinyin>=0.50.0",
    "jieba>=0.42.1",
]
mcp = ["mcp>=1.0.0,<2", "cryptography>=3.4,<50"]
llm = ["httpx>=0.27.0"]
vectors = ["sqlite-vec>=0.1.0"]
tokenizer = ["pypinyin>=0.50.0", "jieba>=0.42.1"]
dev = ["pytest>=8.0"]
v1-dev = [
    "mcp>=1.0.0,<2",
    "cryptography>=3.4,<50",
    "httpx>=0.27.0",
    "sqlite-vec>=0.1.0",
    "pypinyin>=0.50.0",
    "jieba>=0.42.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"knowledge_weaver.migrations" = ["*.sql"]
"knowledge_weaver" = ["contracts_v1/*"]

[project.scripts]
memorelay-core = "knowledge_weaver.cli:main"
knowledge-weaver = "knowledge_weaver.server:main"
kw-memory = "knowledge_weaver.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/XiaoyaoLinghao/MemoRelay"
Repository = "https://github.com/XiaoyaoLinghao/MemoRelay-Core"
